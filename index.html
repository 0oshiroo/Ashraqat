<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثرٌ حُر | منصة الفكر الحر</title>

    <!-- Quill Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --maroon: #800020;
            --maroon-light: #a31f34;
            --crimson: #dc143c;
            --gold: #c9a84c;
            --text: #e0d7c6;
            --text-muted: #9e9a8f;
            --border: #2a2a2a;
            --card-bg: #121212;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            --transition: 0.3s;
        }

        body.black-theme {
            --bg: #000;
        }

        body.gray-theme {
            --bg: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background 0.5s;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--maroon);
            border-radius: 3px;
        }

        a {
            color: var(--maroon-light);
            text-decoration: none;
        }

        /* اللولب */
        .spiral-logo {
            width: 40px;
            height: 40px;
            border: 3px solid var(--maroon);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 3s linear infinite;
            display: inline-block;
            position: relative;
        }

        .spiral-logo::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border: 3px solid var(--crimson);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--maroon);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 1.2rem;
            list-style: none;
        }

        .nav-links li a {
            color: var(--text-muted);
            font-weight: 500;
            transition: var(--transition);
            padding: 0.5rem;
            border-radius: 6px;
        }

        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--gold);
            background: rgba(128, 0, 32, 0.2);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--maroon);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .btn {
            background: var(--maroon);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background: var(--crimson);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--maroon);
            color: var(--maroon-light);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-outline:hover {
            background: var(--maroon);
            color: white;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: #0a0a0a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--maroon);
            outline: none;
        }

        .post {
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 0;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--maroon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .post-content {
            margin: 1rem 0;
            line-height: 1.8;
        }

        .post-content blockquote {
            border-right: 4px solid var(--maroon);
            padding-right: 1rem;
            margin: 1rem 0;
            color: var(--gold);
            font-style: italic;
        }

        .post-tags span {
            background: rgba(128, 0, 32, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin: 0 0.2rem;
            font-size: 0.8rem;
        }

        .post-actions {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .action-btn:hover {
            color: var(--gold);
        }

        .comments-section {
            margin-top: 1rem;
        }

        .comment {
            padding: 0.5rem 0;
            border-bottom: 1px solid #222;
        }

        .profile-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
            background: #222;
        }
    </style>
</head>

<body class="black-theme" id="mainBody">

    <nav class="navbar">
        <div class="nav-brand"><span class="spiral-logo"></span> أثرٌ حُر</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#" data-page="home" class="active">الرئيسية</a></li>
            <li><a href="#" data-page="post-editor">النشر</a></li>
            <li><a href="#" data-page="profile">البروفايل</a></li>
            <li><a href="#" data-page="about">عن المنصة</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap:1rem;">
            <button class="theme-toggle" id="themeToggle">🌓 وضع القراءة</button>
            <span id="userGreeting" style="color:var(--gold); font-size:0.9rem;"></span>
            <button class="btn-outline" id="logoutBtn" style="display:none;">تسجيل خروج</button>
        </div>
    </nav>

    <div id="app" class="container"></div>

    <script type="module">
        // ==================== تهيئة Firebase (Modular) ====================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-analytics.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            setPersistence,
            inMemoryPersistence
        } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            query,
            orderBy,
            where,
            serverTimestamp,
            arrayUnion,
            arrayRemove,
            runTransaction,
            FieldPath
        } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJ58jt4HDxyBvOjUF9F3JS7pIwITU_J9Q",
            authDomain: "ashraqat-2d723.firebaseapp.com",
            projectId: "ashraqat-2d723",
            storageBucket: "ashraqat-2d723.firebasestorage.app",
            messagingSenderId: "779713061566",
            appId: "1:779713061566:web:9b3e62ecabaec52e1ff4ef",
            measurementId: "G-2QKCKXLB6J"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // ==================== تهيئة Firebase Admin (مثال فقط) ====================
        // هذه الشيفرة للـ Node/Backend، ولا تُستخدم داخل المتصفح.
        // import { initializeApp as initializeAdminApp } from 'firebase-admin/app';


        const auth = getAuth(app);
        const db = getFirestore(app);

        // ❌ منع التخزين المحلي نهائياً – الجلسة في الذاكرة فقط
        setPersistence(auth, inMemoryPersistence)
            .then(() => console.log("✅ الجلسة مؤقتة – لا تخزين محلي."))
            .catch(err => console.error("خطأ في إعداد التخزين:", err));

        // ==================== المتغيرات العامة ====================
        let currentUser = null;
        let userProfile = null;
        let currentPage = 'home';
        let theme = 'black';
        let globalPosts = [];
        let feedFilter = 'all';
        let unsubscribeFeed = null;

        const appDiv = document.getElementById('app');
        const navLinks = document.querySelectorAll('.nav-links li a');
        const logoutBtn = document.getElementById('logoutBtn');
        const userGreeting = document.getElementById('userGreeting');
        const themeToggle = document.getElementById('themeToggle');

        // ==================== التنقل بين الصفحات ====================
        function navigateTo(page, data = null) {
            currentPage = page;
            navLinks.forEach(l => l.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
            renderPage(page, data);
        }

        navLinks.forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                const page = link.dataset.page;
                if (!currentUser && page !== 'about') navigateTo('auth');
                else navigateTo(page);
            });
        });

        // ==================== واجهة المستخدم ====================
        function setUserUI(user) {
            if (user) {
                userGreeting.textContent = `أهلاً، ${user.displayName || user.email}`;
                logoutBtn.style.display = 'inline-block';
            } else {
                userGreeting.textContent = '';
                logoutBtn.style.display = 'none';
            }
        }

        function applyTheme(t) {
            theme = t;
            document.body.className = t === 'black' ? 'black-theme' : 'gray-theme';
            if (currentUser && userProfile) {
                updateDoc(doc(db, 'users', currentUser.uid), { theme: t }).catch(() => { });
            }
        }

        themeToggle.onclick = () => applyTheme(theme === 'black' ? 'gray' : 'black');
        logoutBtn.onclick = () => signOut(auth);

        // ==================== المصادقة ====================
        async function signUp(email, password, username, displayName, bio) {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            const unameLower = username.toLowerCase().trim();
            const unameRef = doc(db, 'usernames', unameLower);

            await runTransaction(db, async (transaction) => {
                const unameDoc = await transaction.get(unameRef);
                if (unameDoc.exists()) throw new Error('اسم المستخدم محجوز.');
                transaction.set(unameRef, { uid: cred.user.uid });
                transaction.set(doc(db, 'users', cred.user.uid), {
                    email,
                    username: unameLower,
                    displayName,
                    bio: bio || '',
                    avatarUrl: '',
                    coverUrl: '',
                    followers: [],
                    following: [],
                    bookmarks: [],
                    theme: 'black',
                    role: email === 'ashraqat.adel@atharhurr.com' ? 'admin' : 'user',
                    createdAt: serverTimestamp()
                });
            });

            // تعيين الاسم الظاهر للمستخدم
            await updateDoc(doc(db, 'users', cred.user.uid), {}); // فقط لاستكمال
            // تحديث بروفايل الـ Auth
            await cred.user.updateProfile({ displayName });
        }

        function signInUser(email, password) {
            return signInWithEmailAndPassword(auth, email, password);
        }

        // مراقبة حالة المستخدم
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                const userDocRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    userProfile = userSnap.data();
                    userProfile.id = user.uid;
                    applyTheme(userProfile.theme || 'black');
                } else {
                    // بيانات المستخدم غير موجودة ← تسجيل خروج
                    userProfile = null;
                    await signOut(auth);
                    return;
                }
                setUserUI(user);
                if (['auth'].includes(currentPage) || !currentPage) navigateTo('home');
                else renderPage(currentPage);
            } else {
                currentUser = null;
                userProfile = null;
                setUserUI(null);
                applyTheme('black');
                if (currentPage !== 'auth') navigateTo('auth');
            }
        });

        // ==================== عرض الصفحات ====================
        function renderPage(page, data = null) {
            switch (page) {
                case 'auth': renderAuth(); break;
                case 'home': renderHome(); break;
                case 'post-editor': renderPostEditor(data); break;
                case 'profile': renderProfile(); break;
                case 'about': renderAbout(); break;
                default: renderHome();
            }
        }

        // ---------- صفحة الدخول ----------
        function renderAuth() {
            appDiv.innerHTML = `
            <div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
                <div class="card" style="max-width:450px; width:100%; border:1px solid var(--maroon);">
                    <h2 style="text-align:center; color:var(--gold);">🔐 أثرٌ حُر</h2>
                    <div id="authForm"></div>
                    <div style="text-align:center; margin-top:1rem;" id="switchAuth"></div>
                </div>
            </div>`;
            showLoginForm();
        }

        function showLoginForm() {
            document.getElementById('authForm').innerHTML = `
                <div class="input-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail"></div>
                <div class="input-group"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
                <button class="btn" id="loginBtn" style="width:100%;">تسجيل الدخول</button>
                <p id="loginError" style="color:red;"></p>`;
            document.getElementById('loginBtn').onclick = async () => {
                const e = document.getElementById('loginEmail').value.trim();
                const p = document.getElementById('loginPass').value;
                try { await signInUser(e, p); } catch (err) {
                    document.getElementById('loginError').textContent = err.message;
                }
            };
            document.getElementById('switchAuth').innerHTML = '<span>ليس لديك حساب؟ <a href="#" id="toSignUp">أنشئ حساباً</a></span>';
            document.getElementById('toSignUp').onclick = e => { e.preventDefault(); showSignUpForm(); };
        }

        function showSignUpForm() {
            document.getElementById('authForm').innerHTML = `
                <div class="input-group"><label>البريد الإلكتروني</label><input type="email" id="signEmail"></div>
                <div class="input-group"><label>كلمة المرور (8 أحرف)</label><input type="password" id="signPass" minlength="8"></div>
                <div class="input-group"><label>اسم المستخدم (فريد)</label><input type="text" id="signUname"></div>
                <div class="input-group"><label>الاسم الظاهر</label><input type="text" id="signDisp"></div>
                <div class="input-group"><label>نبذة</label><textarea id="signBio" rows="2"></textarea></div>
                <button class="btn" id="signUpBtn" style="width:100%;">إنشاء الحساب</button>
                <p id="signError" style="color:red;"></p>`;
            document.getElementById('signUpBtn').onclick = async () => {
                const em = document.getElementById('signEmail').value.trim();
                const pw = document.getElementById('signPass').value;
                const un = document.getElementById('signUname').value.trim();
                const dn = document.getElementById('signDisp').value.trim();
                const bio = document.getElementById('signBio').value.trim();
                if (!em || !pw || !un || !dn) {
                    document.getElementById('signError').textContent = 'الحقول المطلوبة ناقصة.';
                    return;
                }
                try { await signUp(em, pw, un, dn, bio); } catch (err) {
                    document.getElementById('signError').textContent = err.message;
                }
            };
            document.getElementById('switchAuth').innerHTML = '<span>لديك حساب؟ <a href="#" id="toLogin">تسجيل الدخول</a></span>';
            document.getElementById('toLogin').onclick = e => { e.preventDefault(); showLoginForm(); };
        }

        // ---------- الصفحة الرئيسية ----------
        function renderHome() {
            appDiv.innerHTML = `
            <div class="card">
                <h3>📜 الموجز الفكري</h3>
                <div style="margin:1rem 0;">
                    <button class="btn-outline" id="feedAllBtn">الكل</button>
                    <button class="btn-outline" id="feedFollowBtn">المتابَعون</button>
                </div>
                <div id="feedContainer">جاري التحميل...</div>
            </div>`;
            setupFeed();
        }

        function setupFeed() {
            if (unsubscribeFeed) unsubscribeFeed();
            const feedDiv = document.getElementById('feedContainer');
            document.getElementById('feedAllBtn').style.background = 'var(--maroon)';
            document.getElementById('feedFollowBtn').style.background = 'transparent';

            const postsQuery = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
            unsubscribeFeed = onSnapshot(postsQuery, snap => {
                globalPosts = [];
                snap.forEach(d => globalPosts.push({ id: d.id, ...d.data() }));
                applyFilter();
            });

            document.getElementById('feedAllBtn').onclick = () => {
                feedFilter = 'all';
                document.getElementById('feedAllBtn').style.background = 'var(--maroon)';
                document.getElementById('feedFollowBtn').style.background = 'transparent';
                applyFilter();
            };
            document.getElementById('feedFollowBtn').onclick = () => {
                feedFilter = 'following';
                document.getElementById('feedFollowBtn').style.background = 'var(--maroon)';
                document.getElementById('feedAllBtn').style.background = 'transparent';
                applyFilter();
            };

            function applyFilter() {
                if (!feedDiv) return;
                let posts = globalPosts;
                if (feedFilter === 'following' && userProfile) {
                    posts = posts.filter(p => userProfile.following.includes(p.authorId));
                }
                feedDiv.innerHTML = posts.length ? posts.map(p => buildPostHTML(p)).join('')
                    : '<p style="color:var(--text-muted);">لا توجد منشورات بعد.</p>';
                attachPostEvents();
            }
        }

        function buildPostHTML(post) {
            const isAnon = post.isAnonymous;
            const author = isAnon ? 'مجهول' : (post.authorName || 'مستخدم');
            const time = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString('ar-SA') : '';
            const tags = post.tags?.map(t => `<span>#${t}</span>`).join('') || '';
            const likeCnt = post.likes?.length || 0;
            const liked = post.likes?.includes(currentUser?.uid);
            const isOwner = currentUser && post.authorId === currentUser.uid;
            const isAdmin = userProfile?.role === 'admin';
            return `
            <div class="post" data-post-id="${post.id}">
                <div class="post-header">
                    <div class="post-avatar">${author.charAt(0)}</div>
                    <div><strong>${author}</strong><div class="post-meta">${time} · ${post.type || 'مقال'}</div></div>
                </div>
                <div class="post-content">${post.content}</div>
                <div class="post-tags">${tags}</div>
                <div class="post-actions">
                    <button class="action-btn like-btn" data-id="${post.id}"><i class="fa${liked ? 's' : 'r'} fa-heart" style="color:${liked ? 'var(--crimson)' : ''}"></i> ${likeCnt}</button>
                    <button class="action-btn comment-toggle" data-id="${post.id}"><i class="far fa-comment"></i> تعليق</button>
                    ${isOwner ? `<button class="action-btn edit-post-btn" data-id="${post.id}"><i class="fas fa-edit"></i></button>
                    <button class="action-btn delete-post-btn" data-id="${post.id}"><i class="fas fa-trash"></i></button>` : ''}
                    ${isAdmin && !isOwner ? `<button class="action-btn admin-delete-btn" data-id="${post.id}"><i class="fas fa-gavel"></i></button>` : ''}
                    <button class="action-btn bookmark-btn" data-id="${post.id}"><i class="far fa-bookmark"></i></button>
                    <button class="action-btn quote-btn" data-id="${post.id}"><i class="fas fa-quote-left"></i></button>
                </div>
                <div class="comments-section" id="comments-${post.id}" style="display:none;"></div>
            </div>`;
        }

        // ==================== الأحداث المرتبطة بالمنشورات ====================
        function attachPostEvents() {
            document.querySelectorAll('.like-btn').forEach(b => {
                b.onclick = async function () {
                    const id = this.dataset.id;
                    const ref = doc(db, 'posts', id);
                    const post = globalPosts.find(p => p.id === id);
                    if (!post || !currentUser) return;
                    if (post.likes?.includes(currentUser.uid)) {
                        await updateDoc(ref, { likes: arrayRemove(currentUser.uid) });
                    } else {
                        await updateDoc(ref, { likes: arrayUnion(currentUser.uid) });
                    }
                };
            });

            document.querySelectorAll('.comment-toggle').forEach(b => {
                b.onclick = async function () {
                    const id = this.dataset.id;
                    const section = document.getElementById(`comments-${id}`);
                    if (section.style.display === 'block') { section.style.display = 'none'; return; }
                    section.style.display = 'block';
                    section.innerHTML = 'جاري التحميل...';
                    const commentsRef = collection(db, 'posts', id, 'comments');
                    const q = query(commentsRef, orderBy('createdAt', 'asc'));
                    const snap = await getDocs(q);
                    let html = '';
                    snap.forEach(d => {
                        const c = d.data();
                        html += `<div class="comment"><strong>${c.authorName || 'مستخدم'}</strong>: ${c.text}</div>`;
                    });
                    html += `<div style="margin-top:0.5rem;">
                        <input type="text" id="commentInput-${id}" placeholder="أضف تعليقاً..." style="width:100%; background:#0a0a0a; border:1px solid var(--border); color:var(--text); padding:0.5rem;">
                        <button class="btn" id="commentSubmit-${id}" style="margin-top:0.3rem;">إرسال</button>
                    </div>`;
                    section.innerHTML = html;
                    document.getElementById(`commentSubmit-${id}`).onclick = async () => {
                        const txt = document.getElementById(`commentInput-${id}`).value.trim();
                        if (!txt) return;
                        await addDoc(collection(db, 'posts', id, 'comments'), {
                            text: txt,
                            authorId: currentUser.uid,
                            authorName: userProfile.displayName,
                            createdAt: serverTimestamp()
                        });
                        document.getElementById(`commentInput-${id}`).value = '';
                        b.click(); b.click(); // refresh
                    };
                };
            });

            document.querySelectorAll('.edit-post-btn').forEach(b => {
                b.onclick = function () {
                    const id = this.dataset.id;
                    const post = globalPosts.find(p => p.id === id);
                    if (!post) return;
                    navigateTo('post-editor', { editId: id, ...post });
                };
            });

            document.querySelectorAll('.delete-post-btn').forEach(b => {
                b.onclick = async function () {
                    if (!confirm('حذف المنشور؟')) return;
                    await deleteDoc(doc(db, 'posts', this.dataset.id));
                };
            });

            document.querySelectorAll('.admin-delete-btn').forEach(b => {
                b.onclick = async function () {
                    if (!confirm('حذف إداري للمنشور؟')) return;
                    await deleteDoc(doc(db, 'posts', this.dataset.id));
                };
            });

            document.querySelectorAll('.bookmark-btn').forEach(b => {
                b.onclick = async function () {
                    const id = this.dataset.id;
                    const userRef = doc(db, 'users', currentUser.uid);
                    if (!userProfile.bookmarks.includes(id)) {
                        await updateDoc(userRef, { bookmarks: arrayUnion(id) });
                    } else {
                        await updateDoc(userRef, { bookmarks: arrayRemove(id) });
                    }
                };
            });

            document.querySelectorAll('.quote-btn').forEach(b => {
                b.onclick = function () {
                    const id = this.dataset.id;
                    const selection = window.getSelection().toString().trim();
                    if (!selection) { alert('حدد نصاً لاقتباسه.'); return; }
                    navigateTo('post-editor', { quoteText: selection, quotePostId: id });
                };
            });
        }

        // ---------- محرر النشر ----------
        let quillEditor = null;

        async function renderPostEditor(data = null) {
            const editMode = data && data.editId;
            const initialContent = editMode ? data.content : '';
            const initialTags = editMode ? (data.tags || []).join(', ') : '';
            const quoteText = data?.quoteText || '';
            const quotePostId = data?.quotePostId || '';

            appDiv.innerHTML = `
            <div class="card">
                <h3>${editMode ? 'تعديل المنشور' : '✍️ نشر أثر جديد'}</h3>
                <div class="input-group">
                    <label>نوع المنشور</label>
                    <select id="postType" style="background:#0a0a0a; color:var(--text); border:1px solid var(--border); padding:0.5rem; border-radius:6px;">
                        <option value="مقال طويل">مقال طويل</option>
                        <option value="مراجعة كتاب">مراجعة كتاب</option>
                        <option value="رأي عابر">رأي عابر</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>الوسوم (مفصولة بفواصل)</label>
                    <input type="text" id="tagsInput" placeholder="فلسفة, تاريخ" value="${initialTags}">
                </div>
                <div class="input-group">
                    <label><input type="checkbox" id="anonymousCheck"> نشر مجهول</label>
                </div>
                <div id="quillEditor" style="height:300px; background:#0a0a0a; color:var(--text);">${initialContent}</div>
                ${quoteText ? `<p style="margin-top:1rem;"><strong>نص مقتبس:</strong> <blockquote style="border-right:4px solid var(--maroon); padding-right:1rem;">${quoteText}</blockquote></p>` : ''}
                <button class="btn" id="publishBtn" style="margin-top:1rem;">${editMode ? 'حفظ التعديلات' : 'نشر'}</button>
                ${editMode ? '<button class="btn-outline" id="cancelEdit" style="margin-right:1rem;">إلغاء</button>' : ''}
            </div>`;

            quillEditor = new Quill('#quillEditor', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'header': 1 }, { 'header': 2 }],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'font': [] }],
                        [{ 'align': [] }],
                        ['blockquote', 'code-block'],
                        ['link', 'image']
                    ]
                }
            });

            document.getElementById('publishBtn').onclick = async () => {
                const content = quillEditor.root.innerHTML;
                const type = document.getElementById('postType').value;
                const tags = document.getElementById('tagsInput').value.split(',').map(t => t.trim()).filter(t => t);
                const isAnonymous = document.getElementById('anonymousCheck').checked;
                if (!content.replace(/<[^>]*>/g, '').trim()) return alert('المحتوى فارغ.');

                if (editMode) {
                    await updateDoc(doc(db, 'posts', data.editId), {
                        content, type, tags, isAnonymous,
                        editedAt: serverTimestamp()
                    });
                    navigateTo('home');
                } else {
                    const postData = {
                        content,
                        type,
                        tags,
                        isAnonymous,
                        authorId: currentUser.uid,
                        authorName: isAnonymous ? 'مجهول' : userProfile.displayName,
                        likes: [],
                        createdAt: serverTimestamp()
                    };
                    if (quoteText) {
                        postData.quotedText = quoteText;
                        postData.quotedPostId = quotePostId;
                    }
                    await addDoc(collection(db, 'posts'), postData);
                    navigateTo('home');
                }
            };

            if (editMode) {
                document.getElementById('cancelEdit').onclick = () => navigateTo('home');
            }
        }

        // ---------- البروفايل ----------
        async function renderProfile() {
            if (!userProfile) return;
            const isOwner = true;
            appDiv.innerHTML = `
            <div class="card">
                <div style="position:relative;">
                    <img src="${userProfile.coverUrl || 'https://via.placeholder.com/900x200/222/var(--maroon)?text=غلاف'}" class="profile-cover" id="coverImg">
                    ${isOwner ? '<button class="btn-outline" id="changeCover" style="position:absolute; bottom:10px; left:10px;">تغيير الغلاف</button>' : ''}
                </div>
                <div style="display:flex; align-items:center; margin-top:-30px; padding:0 1rem;">
                    <img src="${userProfile.avatarUrl || 'https://via.placeholder.com/80/800020/white?text=' + (userProfile.displayName || '?').charAt(0)}" style="width:80px; height:80px; border-radius:50%; border:3px solid var(--maroon);">
                    <div style="margin-right:1rem;">
                        <h2>${userProfile.displayName}</h2>
                        <p style="color:var(--text-muted);">@${userProfile.username}</p>
                        <p>${userProfile.bio || ''}</p>
                        <div style="margin:0.5rem 0;">
                            <span>متابِعون: ${userProfile.followers.length}</span> ·
                            <span>يتابع: ${userProfile.following.length}</span>
                        </div>
                        ${isOwner ? '<button class="btn-outline" id="editProfileBtn">تعديل البروفايل</button>' : ''}
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>منشوراتي</h3>
                <div id="userPosts"></div>
            </div>
            <div class="card">
                <h3>المحفوظات (Bookmarks)</h3>
                <div id="bookmarksContainer"></div>
            </div>`;

            // منشورات المستخدم
            const q = query(collection(db, 'posts'), where('authorId', '==', currentUser.uid), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            let html = '';
            snap.forEach(d => {
                const p = d.data();
                html += `<div class="post">${p.content.substring(0, 200)}...</div>`;
            });
            document.getElementById('userPosts').innerHTML = html || '<p>لا منشورات.</p>';

            // المحفوظات
            if (userProfile.bookmarks.length) {
                const bookmarkIds = userProfile.bookmarks;
                const bookmarkQuery = query(collection(db, 'posts'), where(FieldPath.documentId(), 'in', bookmarkIds));
                const bSnap = await getDocs(bookmarkQuery);
                let bHtml = '';
                bSnap.forEach(d => {
                    const p = d.data();
                    bHtml += `<div class="post">${p.content.substring(0, 200)}...</div>`;
                });
                document.getElementById('bookmarksContainer').innerHTML = bHtml || '<p>لا محفوظات.</p>';
            } else {
                document.getElementById('bookmarksContainer').innerHTML = '<p>لا توجد منشورات محفوظة.</p>';
            }

            document.getElementById('editProfileBtn')?.addEventListener('click', () => {
                const newBio = prompt('السيرة الذاتية:', userProfile.bio);
                if (newBio !== null) {
                    updateDoc(doc(db, 'users', currentUser.uid), { bio: newBio }).then(() => {
                        userProfile.bio = newBio;
                        renderProfile();
                    });
                }
            });

            document.getElementById('changeCover')?.addEventListener('click', () => {
                const url = prompt('رابط صورة الغلاف:', userProfile.coverUrl);
                if (url) {
                    updateDoc(doc(db, 'users', currentUser.uid), { coverUrl: url }).then(() => {
                        userProfile.coverUrl = url;
                        renderProfile();
                    });
                }
            });
        }

        // ---------- عن المنصة ----------
        function renderAbout() {
            appDiv.innerHTML = `
            <div class="card">
                <h2>عن أثرٍ حُر</h2>
                <p style="margin:1.5rem 0; font-size:1.1rem; line-height:2;">أثرٌ حُر: منصة فكرية مستقلة، تُعنى بتفكيك البنى الاجتماعية، وقراءة التاريخ والوجود من زوايا غير تقليدية. هنا، حيث تتقاطع ظلمة الواقع مع شغف الفكرة، نقتفي أثر الحرية والصراع الإنساني. نحن لا نمنح العناوين للظلال، بل نبحث عن الحقيقة الكامنة في أعمق مساراتها المجرورة.</p>
                <p style="color:var(--gold);">لدعم المنصة: <strong>6111022411</strong></p>
            </div>`;
        }

        // ==================== بدء التطبيق ====================
        navigateTo('auth');
        console.log('✅ أثرٌ حُر – المنصة جاهزة (Modular SDK).');
    </script>
</body>

</html>
